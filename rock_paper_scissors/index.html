<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>

  <div id="buttons">
    <button id="rock"><i class="fas fa-hand-back-fist"></i> Rock</button>
    <button id="paper"><i class="fas fa-hand"></i> Paper</button>
    <button id="scissors"><i class="fas fa-hand-scissors"></i> Scissors</button>
  </div>
  

  <div id="scoreboard">
    <p>You: <span id="user-score">0</span></p>
    <p>Computer: <span id="computer-score">0</span></p>
  </div>

  <div id="result">
    <p id="message">Make your move!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
